name: Clean homepage legacy logo flash once

on:
  push:
    paths:
      - ".github/workflows/cleanup-home-logo-flash-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy first-paint logos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/index.astro')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '.brand-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:950;color:#156b3b;background:#eaf7df;border:1px solid #d5e9cf}.brand-name',
              '.brand-mark{width:46px;height:46px;display:grid;place-items:center;overflow:hidden;flex:0 0 46px}.brand-mark img{display:block;width:100%;height:100%;object-fit:contain}.brand-name'
            ),
            (
              '.clover{position:relative;width:min(330px,100%);aspect-ratio:1;border-radius:50%;background:#fff;border:1px solid #e7e4de;box-shadow:0 24px 60px rgba(68,92,65,.12);display:grid;place-items:center}.clover::before{content:"☘";font-size:172px;transform:rotate(-10deg)}.clover::after{content:"stamp\\A moke";white-space:pre;position:absolute;right:20px;top:54px;font-weight:950;font-size:19px;line-height:1.05;transform:rotate(-7deg)}',
              '.clover{position:relative;width:min(330px,100%);aspect-ratio:1;border-radius:50%;background:#fff;border:1px solid #e7e4de;box-shadow:0 24px 60px rgba(68,92,65,.12);display:grid;place-items:center;overflow:hidden}.clover .sm-hero-official-logo{display:block;width:78%;height:78%;object-fit:contain}'
            ),
            (
              '<a class="brand" href={localizedPath(locale,"/")} aria-label="stamp moke home"><span class="brand-mark">sm</span><span class="brand-name">stamp moke</span></a>',
              '<a class="brand" href={localizedPath(locale,"/")} aria-label="stamp moke home"><span class="brand-mark"><img src="/images/biglogo.png?v=20260906-2" alt="" width="64" height="64" decoding="async" fetchpriority="high" /></span><span class="brand-name">stamp moke</span></a>'
            ),
            (
              '<div class="hero-art"><div class="clover" aria-hidden="true"></div></div>',
              '<div class="hero-art"><div class="clover"><img class="sm-hero-official-logo" src="/images/biglogo.png?v=20260906-2" alt="stamp moke" width="512" height="512" decoding="async" fetchpriority="high" /></div></div>'
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected legacy homepage source not found: {old[:80]}')
            text = text.replace(old, new, 1)

          # Old mobile pseudo-element sizing rules are no longer needed after removing the pseudo logo.
          text = text.replace('.clover::before{font-size:132px}', '')
          text = text.replace('.clover::before{font-size:112px}.clover::after{font-size:15px;right:12px;top:42px}', '')

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/cleanup-home-logo-flash-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro .github/workflows/cleanup-home-logo-flash-once.yml
          git commit -m "Render official homepage logos on first paint"
          git pull --rebase origin main
          git push origin HEAD:main
