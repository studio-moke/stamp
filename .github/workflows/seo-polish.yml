name: SEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1"

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build and generate SEO surfaces
        run: npm run build

      - name: Validate crawl and canonical essentials
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/sitemap-pages.xml
          grep -q '<sitemapindex' dist/sitemap.xml
          grep -q 'https://stamp-moke.jp/sitemap-pages.xml' dist/sitemap.xml
          grep -q 'https://stamp-moke.jp/' dist/sitemap-pages.xml
          grep -q 'Sitemap: https://stamp-moke.jp/sitemap.xml' dist/robots.txt
          if grep -q '/admin/' dist/sitemap-pages.xml; then
            echo 'Admin URL leaked into sitemap' >&2
            exit 1
          fi
          if grep -q '/free-admin/' dist/sitemap-pages.xml; then
            echo 'Free-admin URL leaked into sitemap' >&2
            exit 1
          fi
          echo 'SEO audit passed'
