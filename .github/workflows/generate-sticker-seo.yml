name: Generate Sticker SEO Descriptions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-sticker-seo.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate existing v3 records"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: sticker-seo-descriptions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      FORCE_REGENERATE: ${{ inputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 80); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '.statuses[] | select(.context=="Vercel") | .state' | head -n1)
            echo "Vercel status: ${state:-not-found}"
            if [ "$state" = "success" ]; then
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "::error::Vercel deployment failed"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for Vercel production deployment"
          exit 1

      - name: Verify R2 batch credentials
        shell: bash
        run: |
          test -n "$R2_ACCOUNT_ID" || (echo "::error::R2_ACCOUNT_ID is not configured" && exit 1)
          test -n "$R2_ACCESS_KEY_ID" || (echo "::error::R2_ACCESS_KEY_ID is not configured" && exit 1)
          test -n "$R2_SECRET_ACCESS_KEY" || (echo "::error::R2_SECRET_ACCESS_KEY is not configured" && exit 1)
          test -n "$R2_BUCKET_NAME" || (echo "::error::R2_BUCKET_NAME is not configured" && exit 1)

      - name: Create short-lived R2 batch token
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import { r2PutJson } from "./server/api/_r2.js";
          const token=crypto.randomBytes(32).toString("hex");
          const expiresAt=Date.now()+20*60*1000;
          await r2PutJson("sticker-seo/batch-auth.json",{token,expiresAt,createdAt:new Date().toISOString()});
          console.log("BATCH_TOKEN="+token);
          console.log("BATCH_EXPIRES_AT="+expiresAt);
          const fs=await import("node:fs");
          fs.appendFileSync(process.env.GITHUB_ENV, `BATCH_TOKEN=${token}\nBATCH_EXPIRES_AT=${expiresAt}\n`);
          NODE

      - name: Generate unique sticker descriptions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const stickers = JSON.parse(fs.readFileSync("src/data/stickers.json", "utf8"));
          const phraseMap = JSON.parse(fs.readFileSync("src/data/sticker-phrases.json", "utf8"));
          const batchToken = process.env.BATCH_TOKEN;
          const force = String(process.env.FORCE_REGENERATE || "false") === "true";
          const endpoint = "https://stamp-moke.jp/api/sticker-seo";

          function categoryOf(sticker) {
            const text = `${sticker.title || ""} ${sticker.description || ""}`;
            if (/博多|福岡|筑後|方言|関西弁|九州弁/.test(text)) return "方言";
            if (/猫|ねこ|ネコ|犬|いぬ|イヌ|柴犬|コーギー|ポメラニアン|うさぎ|ウサギ|兎|くま|クマ|パンダ|鳥|すずめ|ペンギン|アザラシ|猿|サル|タヌキ|たぬき|ねずみ|動物/.test(text)) return "動物";
            if (/ハート|恋|恋愛|カップル|彼氏|彼女|好き|愛/.test(text)) return "恋愛";
            if (/仕事|ビジネス|敬語|丁寧|会社|職場|マーケター|バイト|働く/.test(text)) return "仕事";
            if (/食べ物|料理|ごはん|肉まん|ビール|お酒|ジョッキ|パン|ケーキ|お菓子/.test(text)) return "食べ物";
            if (/面白|おもしろ|ネタ|シュール|ギャグ|ツッコミ|あるある|ウザい|正論|本音/.test(text)) return "おもしろ";
            if (/挨拶|ありがとう|おはよう|こんにちは|こんばんは|おやすみ|よろしく|おつかれ/.test(text)) return "あいさつ";
            if (/かわいい|可愛い|キュート|癒し|ほんわか|ゆるかわ|もふもふ/.test(text)) return "かわいい";
            if (/日常|毎日|返信|返事|会話|リアクション|気持ち/.test(text)) return "日常";
            return "その他";
          }

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          async function one(sticker) {
            const phrases = phraseMap[String(sticker.id)]?.phrases || [];
            const body = {
              id: String(sticker.id),
              title: sticker.title || "",
              description: sticker.description || "",
              category: categoryOf(sticker),
              phrases,
              force
            };
            const res = await fetch(`${endpoint}?id=${encodeURIComponent(sticker.id)}`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "x-sticker-seo-batch-token": batchToken
              },
              body: JSON.stringify(body)
            });
            const text = await res.text();
            let data = {};
            try { data = JSON.parse(text); } catch {}
            if (!res.ok) throw new Error(`${res.status} ${data.error || text.slice(0, 180)}`);
            return data;
          }

          async function main() {
            let generated = 0, skipped = 0, failed = 0;
            const failures = [];
            const queue = [...stickers];
            const workers = Array.from({ length: 3 }, async (_, workerId) => {
              while (queue.length) {
                const sticker = queue.shift();
                if (!sticker) break;
                try {
                  const data = await one(sticker);
                  if (data.skipped) skipped++;
                  else generated++;
                  console.log(`[${generated + skipped + failed}/${stickers.length}] ${sticker.id} ${data.skipped ? "skipped" : "generated"}`);
                } catch (error) {
                  failed++;
                  failures.push({ id: sticker.id, error: String(error.message || error) });
                  console.error(`[${sticker.id}] ${error.message || error}`);
                }
                await sleep(250);
              }
            });
            await Promise.all(workers);
            console.log(JSON.stringify({ total: stickers.length, generated, skipped, failed, failures }, null, 2));
            if (failed) process.exitCode = 1;
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Expire R2 batch token
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { r2PutJson } from "./server/api/_r2.js";
          await r2PutJson("sticker-seo/batch-auth.json",{token:"",expiresAt:0,expiredAt:new Date().toISOString()});
          NODE
