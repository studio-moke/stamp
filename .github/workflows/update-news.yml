name: Update NEWS

on:
  schedule:
    # 毎日 18:40 UTC = 翌日 03:40 JST
    # 1日1回だけ、LINEスタンプ/SUZURI更新（03:13 JST）の後にNEWSを差分同期する
    - cron: "40 18 * * *"
  workflow_dispatch:

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  sync-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync NEWS only once
        shell: bash
        run: |
          set -euo pipefail

          # NEWS API側で既存IDとの差分だけを判定する。
          # 新着がなければGPT呼び出し・R2書き込みは行われない。
          # 通常は1リクエストだけ。通信障害時のみ1回再試行する。
          response="$(curl --fail-with-body --silent --show-error \
            --retry 1 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 180 \
            "https://stamp-moke.jp/api/news?sync=1")"

          echo "$response" | node -e '
            let raw = "";
            process.stdin.on("data", d => raw += d);
            process.stdin.on("end", () => {
              const data = JSON.parse(raw);
              if (!Array.isArray(data.items)) {
                console.error("NEWS API did not return items[]");
                process.exit(1);
              }
              console.log(`NEWS sync OK: ${data.items.length} items`);
              if (data.items[0]) {
                console.log(`Latest: ${data.items[0].date || ""} ${data.items[0].title || data.items[0].id || ""}`);
              }
            });
          '
