name: Seed Preview Store Test Product

on:
  push:
    branches:
      - feature/digital-material-store
    paths:
      - "scripts/seed-preview-store-test.mjs"
      - ".github/workflows/seed-preview-store-test.yml"

permissions:
  contents: read

concurrency:
  group: preview-store-test
  cancel-in-progress: false

jobs:
  seed-preview-test-product:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PREVIEW_STORE_TEST_SEED: "1"
      DIGITAL_MATERIAL_TEST_PRODUCT_ID: "36425299"

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Seed one verified test product into Preview-only catalog
        run: node scripts/seed-preview-store-test.mjs
