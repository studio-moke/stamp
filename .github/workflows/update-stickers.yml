name: Update Stickers

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stickers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch stickers
        run: node scripts/fetch-stickers.mjs

      - name: Validate sticker count
        run: |
          COUNT=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('src/data/stickers.json','utf8')); console.log(data.length)")
          echo "Fetched sticker count: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "WARNING: Sticker count dropped below 100. Keeping previous data."
            git checkout -- src/data/stickers.json public/images/stickers
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stickers.json public/images/stickers
          git diff --cached --quiet || git commit -m "Update stickers"

      - name: Push changes
        run: git push
