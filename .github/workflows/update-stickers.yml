name: Update Stickers

on:
  schedule:
    # 毎日 18:13 UTC = 翌日 03:13 JST
    - cron: "13 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/line-author.js"
      - "vercel.json"
      - "scripts/fetch-stickers-via-tokyo.mjs"
      - "scripts/fetch-stickers.mjs"
      - "scripts/discover-new-stickers-by-id.mjs"
      - "scripts/discover-new-stickers.mjs"
      - "scripts/generate-sticker-sheets.mjs"
      - "scripts/generate-chat-icons.mjs"
      - "scripts/extract-sticker-phrases.mjs"
      - "scripts/fetch-suzuri-designs.mjs"
      - "scripts/queue-digital-materials.mjs"
      - "scripts/process-digital-material-queue.mjs"
      - "src/lib/sticker-search-tags.ts"
      - ".github/workflows/update-stickers.yml"

permissions:
  contents: write

concurrency:
  group: update-stickers
  cancel-in-progress: true

jobs:
  update-stickers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore sticker ID scan cursor
        uses: actions/cache@v4
        with:
          path: .cache/sticker-id-scan
          key: sticker-id-scan-${{ github.run_id }}
          restore-keys: |
            sticker-id-scan-

      - name: Install preview image generator
        run: npm install --no-save sharp

      - name: Install Japanese OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn

      - name: Discover stickers through Tokyo catalog
        id: tokyo_catalog
        continue-on-error: true
        env:
          LINE_TOKYO_CATALOG_URL: "https://stamp-moke.jp/api/line-author"
          LINE_TOKYO_EXPECTED_REGION: "hnd1"
          LINE_TOKYO_MIN_CATALOG_COUNT: "37"
          LINE_TOKYO_RETRIES: "3"
          LINE_TOKYO_RETRY_DELAY_MS: "3000"
        run: node scripts/fetch-stickers-via-tokyo.mjs

      - name: Discover new stickers by product ID fallback
        if: steps.tokyo_catalog.outcome != 'success'
        env:
          STICKER_ID_SCAN_LIMIT: "5000"
          STICKER_ID_SCAN_CONCURRENCY: "8"
          STICKER_ID_MAX_CONSECUTIVE_MISSING: "120"
          STICKER_ID_SCAN_OVERLAP: "200"
        run: node scripts/discover-new-stickers-by-id.mjs

      - name: Refresh metadata from creator page
        run: node scripts/fetch-stickers.mjs

      - name: Backfill older works through creator product links
        run: node scripts/discover-new-stickers.mjs

      - name: Queue new digital materials
        run: node scripts/queue-digital-materials.mjs

      - name: Prepare at most three pending materials in private R2
        env:
          DIGITAL_MATERIAL_MAX_PER_RUN: "3"
        run: node scripts/process-digital-material-queue.mjs

      - name: Generate protected sticker preview sheets
        run: node scripts/generate-sticker-sheets.mjs

      - name: Generate square Slack Teams Discord icons
        run: node scripts/generate-chat-icons.mjs

      - name: Extract safe sticker phrases
        run: node scripts/extract-sticker-phrases.mjs

      - name: Fetch SUZURI character designs
        continue-on-error: true
        env:
          SUZURI_API_TOKEN: ${{ secrets.SUZURI_API_TOKEN }}
        run: node scripts/fetch-suzuri-designs.mjs

      - name: Validate sticker count
        run: |
          COUNT=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('src/data/stickers.json','utf8')); console.log(data.length)")
          echo "Current sticker count: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "ERROR: Sticker count is below 100. Refusing to commit potentially incomplete data."
            exit 1
          fi
          echo "Sticker count is safe: $COUNT"

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stickers.json src/data/sticker-phrases.json src/data/suzuri-designs.json src/data/digital-material-queue.json public/images/stickers public/images/sticker-sheets public/images/chat-icons
          if git diff --cached --quiet; then
            echo "No sticker changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update stickers, material queue, chat icons and phrase tags"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
