name: Final homepage logo and language cleanup

on:
  push:
    paths:
      - ".github/workflows/fix-final-logo-and-language-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use final logo from first paint and remove duplicate language switcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('src/pages/index.astro')
          text = index.read_text(encoding='utf-8')

          # The final approved logo must be present in the initial HTML, not injected later.
          text = text.replace('/images/biglogo.png?v=20260906-2', '/images/stamp-moke-official-logo.png?v=20260906-3')

          # Remove the duplicate language control below the page content. Language switching remains in the header/menu.
          text = text.replace('    <div class="language-row"><LanguageSwitcher locale={locale}/></div>\n', '')
          text = text.replace('.language-row{margin-top:26px}', '')

          index.write_text(text, encoding='utf-8')

          js = Path('public/home-top-ux.js')
          script = js.read_text(encoding='utf-8')

          # Keep any legacy enhancement code from ever swapping the final logo back to the previous biglogo image.
          script = script.replace('/images/biglogo.png?v=20260906-2', '/images/stamp-moke-official-logo.png?v=20260906-3')
          js.write_text(script, encoding='utf-8')
          PY

          rm .github/workflows/fix-final-logo-and-language-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro public/home-top-ux.js .github/workflows/fix-final-logo-and-language-once.yml
          git commit -m "Use final homepage logo from first paint"
          git pull --rebase origin main
          git push origin HEAD:main