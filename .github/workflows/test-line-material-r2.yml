name: Test LINE material R2

on:
  push:
    branches:
      - feature/digital-material-store
    paths:
      - "scripts/test-line-material-r2.mjs"
      - ".github/workflows/test-line-material-r2.yml"
      - "server/api/_line-materials.js"
      - "server/api/_r2.js"
  workflow_dispatch:
    inputs:
      product_id:
        description: "LINE product ID"
        required: false
        default: "36313683"
      prepared_at:
        description: "Fixed ISO timestamp used to reproduce the immutable ZIP"
        required: false
        default: "2026-09-08T20:15:00.000Z"

permissions:
  contents: read

jobs:
  r2-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINE_PRODUCT_ID: ${{ github.event.inputs.product_id || '36313683' }}
      LINE_MATERIAL_PREPARED_AT: ${{ github.event.inputs.prepared_at || '2026-09-08T20:15:00.000Z' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node-v4
        with:
          node-version: "22"

      - name: Verify required R2 secrets exist
        run: |
          test -n "$R2_ACCOUNT_ID" || (echo "R2_ACCOUNT_ID is missing" && exit 1)
          test -n "$R2_ACCESS_KEY_ID" || (echo "R2_ACCESS_KEY_ID is missing" && exit 1)
          test -n "$R2_SECRET_ACCESS_KEY" || (echo "R2_SECRET_ACCESS_KEY is missing" && exit 1)
          test -n "$R2_BUCKET_NAME" || (echo "R2_BUCKET_NAME is missing" && exit 1)

      - name: Upload exactly one private material ZIP and verify it
        run: node scripts/test-line-material-r2.mjs
