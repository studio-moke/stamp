name: Test LINE material dry-run

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: LINE sticker product ID
        required: true
        default: "36313683"
  push:
    branches:
      - feature/digital-material-store
    paths:
      - scripts/test-line-material.mjs
      - .github/workflows/test-line-material.yml

jobs:
  test-line-material:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run LINE dry-run
        env:
          LINE_PRODUCT_ID: ${{ github.event.inputs.product_id || '36313683' }}
        run: node scripts/test-line-material.mjs "$LINE_PRODUCT_ID"

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-material-${{ github.event.inputs.product_id || '36313683' }}
          path: tmp/line-material-test/
          if-no-files-found: warn
          retention-days: 1
