name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check sticker discovery scripts
        run: |
          node --check scripts/discover-new-stickers-by-id.mjs
          node --check scripts/fetch-stickers.mjs
          node --check scripts/discover-new-stickers.mjs
      - name: Build Astro site
        run: npm run build
