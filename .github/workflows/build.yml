name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Check sticker discovery scripts
        run: |
          node --check server/api/line-author.js
          node --check scripts/fetch-stickers-via-tokyo.mjs
          node --check scripts/discover-new-stickers-by-id.mjs
          node --check scripts/fetch-stickers.mjs
          node --check scripts/discover-new-stickers.mjs
          node --check scripts/noindex-private-pages.mjs
          node --check scripts/generate-sitemap.mjs

      - name: Fix tool routes
        run: node scripts/fix-tool-routes.mjs

      - name: Prepare incremental build
        run: node scripts/prepare-incremental-build.mjs

      - name: Astro build
        shell: bash
        run: |
          set +e
          npx astro build 2>&1 | tee astro-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 20 astro-build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Astro build failed::$msg"
            exit "$status"
          fi

      - name: Upload Astro build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-build-log
          path: astro-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Run post-build content and SEO pipeline
        run: |
          node scripts/inject-home-news.mjs
          node scripts/inject-seo-content.mjs
          node scripts/ensure-global-favicon.mjs
          node scripts/normalize-trailing-slashes.mjs
          node scripts/fix-sticker-list-links.mjs
          node scripts/limit-home-stickers.mjs
          node scripts/fix-sticker-navigation.mjs
          node scripts/check-sticker-links.mjs
          node scripts/noindex-private-pages.mjs
          node scripts/generate-sitemap.mjs

      - name: Validate SEO surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/sitemap-pages.xml
          grep -q '<sitemapindex' dist/sitemap.xml
          grep -q 'https://stamp-moke.jp/sitemap-pages.xml' dist/sitemap.xml
          grep -q 'https://stamp-moke.jp/' dist/sitemap-pages.xml
          grep -q 'Sitemap: https://stamp-moke.jp/sitemap.xml' dist/robots.txt
          if grep -q '/admin/' dist/sitemap-pages.xml; then
            echo 'Admin URL leaked into sitemap' >&2
            exit 1
          fi
          if grep -q '/free-admin/' dist/sitemap-pages.xml; then
            echo 'Free-admin URL leaked into sitemap' >&2
            exit 1
          fi
          echo 'Build and SEO validation passed'
