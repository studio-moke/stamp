name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Check sticker discovery scripts
        run: |
          node --check server/api/line-author.js
          node --check scripts/fetch-stickers-via-tokyo.mjs
          node --check scripts/discover-new-stickers-by-id.mjs
          node --check scripts/fetch-stickers.mjs
          node --check scripts/discover-new-stickers.mjs
      - name: Fix tool routes
        run: node scripts/fix-tool-routes.mjs
      - name: Prepare incremental build
        run: node scripts/prepare-incremental-build.mjs
      - name: Astro build
        run: npx astro build
      - name: Inject home news
        run: node scripts/inject-home-news.mjs
      - name: Inject SEO content
        run: node scripts/inject-seo-content.mjs
      - name: Ensure global favicon
        run: node scripts/ensure-global-favicon.mjs
